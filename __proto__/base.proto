syntax = "proto3";

option go_package = "futu/pb";

import "common.proto";

/** 初始化请求 */
message InitReq {
  message C2S {
    /** 客户端版本号，clientVer = "."以前的数 * 100 + "."以后的，举例：1.1版本的 clientVer 为1 * 100 + 1 = 101，2.21版本为2 * 100 + 21 = 221 */
    int32 clientVer = 1;
    /** 客户端唯一标识，无生具体生成规则，客户端自己保证唯一性即可 */
    string clientID = 2;
    /** 此连接是否接收市场状态、交易需要重新解锁等等事件通知，true 代表接收，OpenD 就会向此连接推送这些通知，反之 false 代表不接收不推送如果通信要加密，首先得在 OpenD 和客户端都配置 RSA 密钥，不配置始终不加密 */
    optional bool recvNotify = 3;
    /**
      如果配置了 RSA 密钥且指定的加密算法不为 PacketEncAlgo_None 则加密(即便这里不设置，配置了 RSA 密钥，也会采用默认加密方式)，默认采用 FTAES_ECB 算法
      指定包加密算法，参见 Common.PacketEncAlgo 的枚举定义
    */
    optional int32 packetEncAlgo = 4;
    /**指定这条连接上的推送协议格式，若不指定则使用 push_proto_type 配置项*/
    optional int32 pushProtoFmt = 5;
  }
  C2S c2s = 1;
}

/** 初始化响应 */
message InitRes {
  message S2C {
    /** OpenD 的版本号 */
    int32 serverVer = 1;
    /** OpenD 登录的用户 ID */
    uint64 loginUserID = 2;
    /** 此连接的连接 ID，连接的唯一标识 */
    uint64 connID = 3;
    /** 此连接后续 AES 加密通信的 Key，固定为16字节长字符串 */
    string connAESKey = 4;
    /** 心跳保活间隔 */
    int32 keepAliveInterval = 5;
    /** AES 加密通信 CBC 加密模式的 iv，固定为16字节长字符串 */
    optional string aesCBCiv = 6; //
  }
  common.RetType retType = 1;
  optional string retMsg = 2;
  optional int32 errCode = 3;
  optional S2C s2c = 4;
}

/** 心跳检测：ping */
message Ping {
  message C2S {
    int64 time = 1;
  }
  C2S c2s = 1;
}

/* 心跳响应 */
message Pong {
  message S2C {
    int64 time = 1;
  }
  common.RetType retType = 1;
  optional string retMsg = 2;
  optional int32 errCode = 3;
  optional S2C s2c = 4;
}

/* 交易解锁请求 */
message UnlockReq {
  message C2S {
    bool unlock = 1; //true 解锁交易，false 锁定交易
    optional string pwdMD5 = 2; //交易密码的 32 位 MD5 加密（全小写），解锁交易必须要填密码，锁定交易不需要验证密码，可不填
    optional common.SecurityFirm securityFirm = 3; //券商标识，取值见 Trd_Common.SecurityFirm
  }
  C2S c2s = 1;
}

/* 交易解锁响应 */
message UnlockRes {
  message S2C {
  }
  common.RetType retType = 1; //RetType，返回结果
  optional string retMsg = 2;
  optional int32 errCode = 3;
  optional S2C s2c = 4;
}

// 静态数据请求
message StaticInfoReq {
  message C2S {
    optional int32 market = 1;
    optional int32 secType = 2;
    repeated common.Security securityList = 3;
  }
  C2S c2s = 1;
}

// 静态数据响应
message StaticInfoRes {
  message S2C {
    repeated common.SecurityStaticInfo StaticInfoList = 1;
  }
  common.RetType retType = 1; //RetType，返回结果
	optional string retMsg = 2;
	optional int32 errCode = 3;
  optional S2C s2c = 4;
}

// 持仓列表请求
message PositionListReq {
  message C2S {
    common.TrdHeader header = 1; //交易公共参数头
    optional common.TrdFilterConditions filterConditions = 2; //过滤条件
    optional double filterPLRatioMin = 3; //过滤盈亏百分比下限，高于此比例的会返回。证券账户使用摊薄成本价的盈亏比例，期货账户使用平均成本价的盈亏比例
    optional double filterPLRatioMax = 4; //过滤盈亏百分比上限，低于此比例的会返回。证券账户使用摊薄成本价的盈亏比例，期货账户使用平均成本价的盈亏比例
    optional bool refreshCache = 5; //立即刷新 OpenD 缓存的此数据，默认不填。true 向服务器获取最新数据更新缓存并返回；flase 或没填则返回 OpenD 缓存的数据，不会向服务器请求。
    //正常情况下，服务器有更新就会立即推送到 OpenD，OpenD 缓存着数据，API 请求过来，返回同步的缓存数据，一般不需要指定刷新缓存，保证快速返回且减少对服务器的压力
    //如果遇到丢包等情况，可能出现缓存数据与服务器不一致，用户如果发现数据更新有异样，可指定刷新缓存，解决数据同步的问题。
    optional int32 assetCategory = 6; //账户资产类型，JP衍生品账户必填，参考 Trd_Common.TrdAssetCategory
    optional int32 currency = 7; //货币种类，参见 Trd_Common.Currency。加密货币账户必填，其他账户忽略
    optional bool showOptionStrategyView = 8;
  }
  C2S c2s = 1;
}

message PositionListRes {
  message S2C {
    common.TrdHeader header = 1; //交易公共参数头
	  repeated common.Position positionList = 2; //持仓列表
  }
  common.RetType retType = 1;
	optional string retMsg = 2;
	optional int32 errCode = 3;
	optional S2C s2c = 4;
}
