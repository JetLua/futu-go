syntax = "proto3";

option go_package = "futu/pb";

import "common.proto";

/**订阅交易推送请求*/
message SubAccPushReq {
  message C2S {
    repeated uint64 accIDList = 1; //要接收推送数据的业务账号列表，全量非增量，即使用者请每次传需要接收推送数据的所有业务账号
  }
  C2S c2s = 1;
}

/**订阅交易推送响应*/
message SubAccPushRes {
  message S2C {};
  common.RetType retType = 1; //RetType,返回结果
  optional string retMsg = 2;
  optional int32 errCode = 3;
  optional S2C s2c = 4;
}
